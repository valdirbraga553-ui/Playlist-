<!DOCTYPE html>
<html>
<head>
<title>Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: #0f0f0f; 
        font-family: Roboto, Arial, sans-serif;
    }
    #player {
        width: 100%;
        height: 100vh;
        max-height: 100vh;
    }
    /* Deixa o player responsivo 16:9 no desktop */
    @media (min-width: 768px) {
        #player {
            height: calc(100vw * 0.5625); /* 16:9 */
            max-height: 80vh;
        }
    }
</style>
</head>
<body>

<div id="player"></div>

<script src="https://cdn.jsdelivr.net/gh/valdirbraga553-ui/PDF@main/playerjs.js"></script>

<script>
    var player = new Playerjs({
        id: "player",
        file: "https://archive.org/download/Instrumento/No.Gogo.do.Paulinho.mkv",
        
        // Visual YouTube
        skin: "youtube", // Tema parecido com YouTube
        lang: "pt", // Interface em português
        
        // Áudio
        default_audio_track: "pt", // Força português
        default_audio_lang: "pt",
        
        // Controles iguais YouTube
        autoplay: 1,
        start: 0,
        
        // Atalhos de teclado YouTube
        hotkeys: 1, // Ativa: K=play, J/L=10s, F=fullscreen, M=mute
        
        // Qualidade e velocidade
        quality: "HD",
        speed: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2], // Opções de velocidade
        
        // UI
        title: "Nome do Filme Aqui",
        poster: "https://image.tmdb.org/t/p/w500/b3WeTp42eJSRuE4UZfyPCOJW4c.jpg",
        
        // Cor da barra de progresso igual YouTube
        color: "#FF0000",
        
        // Player fica responsivo
        fluid: true,
        
        // Esconde logo do PlayerJS
        logo: ""
    });
</script>

</body>
</html>
